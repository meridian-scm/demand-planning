name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"
          cache: pip
          cache-dependency-path: backend/dev-requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/dev-requirements.lock
      - name: Check formatting
        working-directory: backend
        run: >-
          ruff format --check app tests
          ../scripts/benchmark_parquet_layouts.py
          ../scripts/validate_forecast_runs.py
      - name: Lint
        working-directory: backend
        run: >-
          ruff check app tests
          ../scripts/benchmark_parquet_layouts.py
          ../scripts/validate_forecast_runs.py
      - name: Type check
        working-directory: backend
        run: >-
          mypy app tests
          ../scripts/benchmark_parquet_layouts.py
          ../scripts/validate_forecast_runs.py
      - name: Test
        working-directory: backend
        run: pytest

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Test components
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application containers
        run: docker compose build

  planner-journey:
    name: Playwright planner journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create backend environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --requirement backend/requirements.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Generate deterministic test artifacts
        run: backend/.venv/bin/python scripts/generate_data.py --config config/data/test.yaml
      - name: Validate deterministic test artifacts
        run: backend/.venv/bin/python scripts/generate_data.py --config config/data/test.yaml --validate-only
      - name: Exercise Parquet layout benchmark
        run: >-
          backend/.venv/bin/python scripts/benchmark_parquet_layouts.py
          --artifact-directory data/generated/test-v1
          --output-directory data/generated/benchmarks/test-v1
          --runs 3
      - name: Generate immutable test forecast run
        run: backend/.venv/bin/python scripts/generate_reference_forecasts.py --config config/forecast/test.yaml
      - name: Validate immutable test forecast run
        run: >-
          backend/.venv/bin/python scripts/validate_forecast_runs.py
          --forecast-root data/generated/test-v1/forecast_runs
      - name: Run planner journey
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
