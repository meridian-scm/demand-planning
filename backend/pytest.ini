[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Makes `app` importable regardless of how pytest is invoked. Without this,
# `python -m pytest` works (Python's -m puts the cwd on sys.path first) but a
# bare `pytest` invocation — e.g. GitHub Actions' `run: pytest tests -q` —
# does not, since pytest's own "prepend" import mode only adds the directory
# containing each test file (tests/ has no __init__.py), not the backend/
# root where the app package actually lives.
pythonpath = .
addopts =
    -ra
    --strict-markers
    --junitxml=reports/junit.xml
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
    --cov-report=html:reports/htmlcov
markers =
    unit: fast, pure-function tests with no I/O
    integration: tests that hit a database (SQLite in-memory by default)
    postgres: integration tests that require a real PostgreSQL instance
filterwarnings =
    ignore::DeprecationWarning:passlib.*
