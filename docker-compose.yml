name: meridian-demand-planning

services:
  backend:
    build:
      context: ./backend
    environment:
      MERIDIAN_ARTIFACT_DIRECTORY: /data/generated
      MERIDIAN_ARTIFACT_DATA_VERSION: ${MERIDIAN_ARTIFACT_DATA_VERSION:-test-v1}
      MERIDIAN_CORS_ORIGINS: '["http://localhost:5173"]'
      MERIDIAN_ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./data/generated:/data/generated:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_ARTIFACT_DATA_VERSION: ${MERIDIAN_ARTIFACT_DATA_VERSION:-test-v1}
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5173"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
